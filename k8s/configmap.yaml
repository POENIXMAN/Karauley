apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-monitor-config
  namespace: dns-monitor
data:
  config.yaml: |
    # DNS Tunnel Detector Configuration
    
    detection:
      # Порог энтропии Шеннона
      entropy_threshold: 4.0
      
      # Максимальная длина домена (подозрительно если больше)
      max_domain_length: 60
      
      # Минимальное соотношение цифр для подозрительности
      digit_ratio_threshold: 0.3
      
      # Подозрительные типы DNS записей
      suspicious_types:
        - TXT    # Часто используется для C2
        - NULL   # IP-Over-DNS (iodine)
        - CNAME  # Может использоваться для туннелей
      
      # Подозрительные паттерны (regex)
      suspicious_patterns:
        - "^[a-zA-Z0-9+/=]{20,}\\."  # Base64
        - "^[0-9a-f]{32,}\\."        # Hex-encoded
    
    whitelist:
      # Домены которые не проверять
      domains:
        - google.com
        - googleapis.com
        - microsoft.com
        - azure.com
        - cloudflare.com
        - amazonaws.com
        - github.com
        - docker.io
    
    prometheus:
      enabled: true
      port: 9999
      path: /metrics
    
    logging:
      level: INFO
      format: json
      # Для SIEM интеграции
      cef_enabled: false

