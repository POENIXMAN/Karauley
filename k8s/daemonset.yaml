apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dns-monitor
  namespace: dns-monitor
  labels:
    app: dns-monitor
    version: "1.0"
spec:
  selector:
    matchLabels:
      app: dns-monitor
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: dns-monitor
      annotations:
        # Prometheus annotations для автоматического scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "9999"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: dns-monitor
      
      # Для доступа к host network и процессам
      hostNetwork: true
      hostPID: true
      
      # DNS policy для hostNetwork
      dnsPolicy: ClusterFirstWithHostNet
      
      containers:
        - name: dns-monitor
          image: dns-monitor:latest
          imagePullPolicy: IfNotPresent
          
          # eBPF требует privileged режим
          securityContext:
            privileged: true
            # Альтернатива: минимальные capabilities
            # capabilities:
            #   add:
            #     - SYS_ADMIN
            #     - SYS_PTRACE
            #     - NET_ADMIN
            #     - BPF
            #     - PERFMON
          
          ports:
            - containerPort: 9999
              name: metrics
              protocol: TCP
          
          # Volume mounts для eBPF
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: config
              mountPath: /etc/dns-monitor
              readOnly: true
          
          # Environment variables
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_PROC
              value: "/host/proc"
            - name: METRICS_PORT
              value: "9999"
          
          # Resource limits
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 100m
          
          # Probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 5
      
      # Volumes
      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: config
          configMap:
            name: dns-monitor-config
      
      # Tolerations для запуска на всех нодах
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      
      # Node selector (опционально)
      # nodeSelector:
      #   kubernetes.io/os: linux

