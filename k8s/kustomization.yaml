apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dns-monitor

resources:
  - namespace.yaml
  - configmap.yaml
  - rbac.yaml
  - daemonset.yaml
  - service.yaml
  - servicemonitor.yaml

commonLabels:
  app.kubernetes.io/name: dns-monitor
  app.kubernetes.io/component: security
  app.kubernetes.io/part-of: dns-tunnel-detection

# Для кастомизации образа
images:
  - name: dns-monitor
    newName: dns-monitor
    newTag: latest

