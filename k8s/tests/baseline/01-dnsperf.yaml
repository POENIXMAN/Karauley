apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsperf-baseline
  namespace: default
  labels:
    app: baseline-traffic
    component: dnsperf
spec:
  replicas: 3
  selector:
    matchLabels:
      app: baseline-traffic
      component: dnsperf
  template:
    metadata:
      labels:
        app: baseline-traffic
        component: dnsperf
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: baseline-traffic
              component: dnsperf
      containers:
        - name: dnsperf
          image: guessi/dnsperf:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              DNS_SERVER=$(cat /etc/resolv.conf | grep nameserver | head -1 | awk '{print $2}')
              echo "Using DNS server: ${DNS_SERVER}"
              echo "Starting dnsperf on node: $(hostname)"
              while true; do
                dnsperf -s "${DNS_SERVER}" \
                  -d /config/domains.txt \
                  -l 30 \
                  -c 5 \
                  -Q 50 \
                  -S 1
                echo "--- dnsperf cycle complete, sleeping 5s ---"
                sleep 5
              done
          volumeMounts:
            - name: domains
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: domains
          configMap:
            name: dnsperf-domains
      restartPolicy: Always
