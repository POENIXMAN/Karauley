apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-discovery-targets
  namespace: default
  labels:
    app: baseline-traffic
    component: k8s-discovery
data:
  targets.sh: |
    #!/bin/sh
    while true; do
      nslookup kubernetes.default.svc.cluster.local 2>/dev/null || true
      nslookup kube-dns.kube-system.svc.cluster.local 2>/dev/null || true
      nslookup kubernetes.default 2>/dev/null || true
      nslookup kube-dns.kube-system 2>/dev/null || true

      nslookup _https._tcp.kubernetes.default.svc.cluster.local 2>/dev/null || true

      for svc in metrics-server kube-scheduler kube-controller-manager etcd; do
        nslookup "${svc}.kube-system.svc.cluster.local" 2>/dev/null || true
      done

      for ns in default kube-system kube-public kube-node-lease; do
        nslookup "any.${ns}.svc.cluster.local" 2>/dev/null || true
      done

      nslookup kubernetes 2>/dev/null || true
      nslookup kube-dns 2>/dev/null || true
      nslookup localhost 2>/dev/null || true

      for i in $(seq 1 10); do
        nslookup "nonexistent-svc-${i}.default.svc.cluster.local" 2>/dev/null || true
      done

      sleep 2
    done
