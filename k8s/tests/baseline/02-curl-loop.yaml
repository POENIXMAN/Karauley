apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl-baseline
  namespace: default
  labels:
    app: baseline-traffic
    component: curl-loop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: baseline-traffic
      component: curl-loop
  template:
    metadata:
      labels:
        app: baseline-traffic
        component: curl-loop
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: baseline-traffic
              component: curl-loop
      containers:
        - name: curl
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              TARGETS="
              https://www.google.com
              https://www.github.com
              https://www.youtube.com
              https://www.facebook.com
              https://www.wikipedia.org
              https://www.reddit.com
              https://www.stackoverflow.com
              https://www.microsoft.com
              https://www.apple.com
              https://www.amazon.com
              https://www.netflix.com
              https://www.linkedin.com
              https://www.twitter.com
              https://www.instagram.com
              https://www.cloudflare.com
              https://www.docker.com
              https://kubernetes.io
              https://grafana.com
              https://prometheus.io
              https://helm.sh
              https://www.nginx.com
              https://nodejs.org
              https://www.python.org
              https://www.rust-lang.org
              https://go.dev
              https://www.npmjs.com
              https://pypi.org
              https://rubygems.org
              https://crates.io
              https://registry.hub.docker.com
              https://cdn.jsdelivr.net
              https://cdnjs.cloudflare.com
              https://fonts.googleapis.com
              https://ajax.googleapis.com
              https://api.github.com
              https://raw.githubusercontent.com
              https://www.yahoo.com
              https://www.bing.com
              https://duckduckgo.com
              https://www.mozilla.org
              "

              echo "Starting curl-loop on node: $(hostname)"
              while true; do
                for url in $TARGETS; do
                  curl -s -o /dev/null -w "%{http_code} %{time_total}s %{url_effective}\n" \
                    --max-time 5 --connect-timeout 3 "$url" 2>/dev/null || true
                  sleep $(awk 'BEGIN{srand(); printf "%.1f", 1 + rand() * 3}')
                done
                echo "--- curl cycle complete ---"
              done
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      restartPolicy: Always
