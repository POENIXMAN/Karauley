apiVersion: apps/v1
kind: Deployment
metadata:
  name: iodine-server
  namespace: attack-server
  labels:
    app: attack-server
    tool: iodine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-server
      tool: iodine
  template:
    metadata:
      labels:
        app: attack-server
        tool: iodine
    spec:
      containers:
        - name: iodined
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache iodine
              echo "Starting iodined for domain: t.attack.test"
              exec iodined -f -c -P "" 10.0.0.1 t.attack.test
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      restartPolicy: Always
