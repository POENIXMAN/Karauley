apiVersion: v1
kind: Namespace
metadata:
  name: attack-server
  labels:
    purpose: dns-tunnel-server
---
# Единый сервис для всех серверов-инструментов.
# Лейбл app=attack-server используется во всех server deployments.
# В один момент запущен только один deployment — сервис направляет на него.
apiVersion: v1
kind: Service
metadata:
  name: tunnel-dns
  namespace: attack-server
  labels:
    app: attack-server
spec:
  selector:
    app: attack-server
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
  type: ClusterIP
