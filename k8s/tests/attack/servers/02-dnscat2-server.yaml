apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnscat2-server
  namespace: attack-server
  labels:
    app: attack-server
    tool: dnscat2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-server
      tool: dnscat2
  template:
    metadata:
      labels:
        app: attack-server
        tool: dnscat2
    spec:
      containers:
        - name: dnscat2
          image: ruby:3.2-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for DNS..."
              sleep 15
              for i in 1 2 3 4 5; do
                apk add --no-cache build-base && break
                echo "apk failed (attempt $i/5), retrying in 20s..."
                sleep 20
              done
              for i in 1 2 3 4 5; do
                gem install dnscat2 && break
                echo "gem install failed (attempt $i/5), retrying in 20s..."
                sleep 20
              done
              command -v dnscat2 >/dev/null 2>&1 || { echo "FATAL: dnscat2 not installed"; sleep 3600; exit 1; }
              echo "Starting dnscat2 server for domain: c2.attack.test"
              exec dnscat2 c2.attack.test
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
      restartPolicy: Always
