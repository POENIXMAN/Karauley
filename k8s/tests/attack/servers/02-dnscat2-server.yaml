apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnscat2-server
  namespace: attack-server
  labels:
    app: attack-server
    tool: dnscat2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-server
      tool: dnscat2
  template:
    metadata:
      labels:
        app: attack-server
        tool: dnscat2
    spec:
      containers:
        - name: dnscat2
          image: ruby:3.2-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for DNS..."
              sleep 10
              for i in 1 2 3 4 5; do
                apk add --no-cache build-base git && break
                echo "apk failed (attempt $i/5), retrying in 15s..."
                sleep 15
              done
              for i in 1 2 3 4 5; do
                gem install bundler && break
                echo "gem install bundler failed (attempt $i/5), retrying in 15s..."
                sleep 15
              done
              for i in 1 2 3 4 5; do
                git clone --depth 1 https://github.com/iagox86/dnscat2.git && break
                echo "git clone failed (attempt $i/5), retrying in 15s..."
                sleep 15
                rm -rf dnscat2
              done
              cd dnscat2/server
              for i in 1 2 3 4 5; do
                bundle install && break
                echo "bundle install failed (attempt $i/5), retrying in 15s..."
                sleep 15
              done
              echo "Starting dnscat2 server for domain: c2.attack.test"
              exec ruby ./dnscat2.rb c2.attack.test
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
      restartPolicy: Always
