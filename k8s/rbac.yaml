apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-monitor
  namespace: dns-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dns-monitor
rules:
  # Для получения информации о подах
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  
  # Для получения информации о namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  
  # Для получения информации о ноде
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  
  # Для получения информации о services (для DNS correlation)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dns-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dns-monitor
subjects:
  - kind: ServiceAccount
    name: dns-monitor
    namespace: dns-monitor

