{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dns-tunnel-monitor.fullname" . }}
  labels:
    {{- include "dns-tunnel-monitor.labels" . | nindent 4 }}
rules:
  # Needed to resolve cgroup_id -> namespace/podname via API (list pods by UID).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
{{- end }}
