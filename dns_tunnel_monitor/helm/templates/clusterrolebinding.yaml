{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dns-tunnel-monitor.fullname" . }}
  labels:
    {{- include "dns-tunnel-monitor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dns-tunnel-monitor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dns-tunnel-monitor.fullname" . }}
    namespace: {{ include "dns-tunnel-monitor.namespace" . }}
{{- end }}
