global:
  namespace: default

image:
  repository: localhost/cgroup-skb-test
  tag: v1
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

daemonset:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  securityContext:
    privileged: true
    runAsUser: 0
    runAsGroup: 0
  hostNetwork: true
  hostPID: true
  dnsPolicy: ClusterFirstWithHostNet
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 100m
  livenessProbe:
    httpGet:
      path: /healthz
      port: 9999
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 9999
    initialDelaySeconds: 5
    periodSeconds: 5
  tolerations:
    - operator: Exists
  nodeSelector: {}

service:
  enabled: true
  type: ClusterIP
  clusterIP: None
  port: 9999
  targetPort: 9999
  name: metrics

prometheus:
  enabled: true
  scrape: true
  port: 9999
  path: /metrics
  # ServiceMonitor for Prometheus Operator (kube-prometheus-stack etc.)
  # Важно: без нужного label Prometheus не будет скрейпить этот ServiceMonitor — в UI не появятся цели и метрик не будет.
  serviceMonitor:
    enabled: true
    interval: 30s
    # Label должен совпадать с именем релиза Prometheus из helm list -A (у вас: prometheus).
    labels:
      release: prometheus

# RBAC: ServiceAccount + ClusterRole (list/get pods) so the monitor can resolve cgroup_id -> namespace/podname.
# If disabled, metrics will show "cgroup_id=..." instead of "default/nginx-xxx".
rbac:
  enabled: true

env:
  CGROUP_PATH: /host-cgroup
  METRICS_PORT: "9999"
  # Set to "1" to log why cgroup_id -> pod name resolution fails (stderr); then check pod logs.
  DEBUG_POD_RESOLVER: "1"
  # Set to "1" to log each <unparseable> event (ip_version, payload hex) to stderr; for diagnostics.
  DEBUG_UNPARSEABLE: ""

# TXT whitelist from file — без пересборки образа. UTF-8 (русские/китайские домены).
# Включить и смонтировать ConfigMap с файлом txt_whitelist.txt.
# Формат файла: секции [domains], [prefixes], [roots]; запись из файла добавляется к встроенному списку.
txtWhitelist:
  enabled: false
  # Если true — создаётся ConfigMap из content ниже и монтируется в под.
  # Альтернатива: создать ConfigMap вручную и указать его имя в configMapName.
  configMapName: ""
  # Используется только если configMapName пустой. Пример:
  # content: |
  #   [domains]
  #   .mycompany.com
  #   .рус
  #   [prefixes]
  #   _custom.
  #   [roots]
  #   mail.mycompany.com
  content: |
    # Пример: раскомментируйте и добавьте свои записи (UTF-8).
    # [domains]
    # [prefixes]
    # [roots]

labels:
  app.kubernetes.io/name: dns-tunnel-monitor
  app.kubernetes.io/component: security
