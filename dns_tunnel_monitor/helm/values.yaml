global:
  namespace: default

image:
  repository: localhost/cgroup-skb-test
  tag: v1
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

daemonset:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  securityContext:
    privileged: true
    runAsUser: 0
    runAsGroup: 0
  hostNetwork: true
  hostPID: true
  dnsPolicy: ClusterFirstWithHostNet
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 100m
  livenessProbe:
    httpGet:
      path: /healthz
      port: 9999
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /ready
      port: 9999
    initialDelaySeconds: 5
    periodSeconds: 5
  tolerations:
    - operator: Exists
  nodeSelector: {}

service:
  enabled: true
  type: ClusterIP
  clusterIP: None
  port: 9999
  targetPort: 9999
  name: metrics

prometheus:
  enabled: true
  scrape: true
  port: 9999
  path: /metrics
  # ServiceMonitor for Prometheus Operator (kube-prometheus-stack etc.)
  # Важно: без нужного label Prometheus не будет скрейпить этот ServiceMonitor — в UI не появятся цели и метрик не будет.
  serviceMonitor:
    enabled: true
    interval: 30s
    # Label должен совпадать с именем релиза Prometheus из helm list -A (у вас: prometheus).
    labels:
      release: prometheus

env:
  CGROUP_PATH: /host-cgroup
  METRICS_PORT: "9999"

labels:
  app.kubernetes.io/name: dns-tunnel-monitor
  app.kubernetes.io/component: security
