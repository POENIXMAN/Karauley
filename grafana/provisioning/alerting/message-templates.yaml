# Кастомные шаблоны уведомлений для Grafana Alerting.
# Использование: в Contact point (Telegram) → Optional settings → Custom template → выбрать имя шаблона (например dns_telegram).
#
# Переменные: .Status, .Alerts, .Alerts.Firing, .CommonLabels, .ExternalURL;
# для каждого алерта: .Labels (в т.ч. threat_type, client_pod, instance), .Annotations, .StartsAt, .GeneratorURL, .ValueString.
apiVersion: 1

templates:
  - orgId: 1
    name: dns_telegram
    template: |
      {{ define "dns_telegram" }}
      {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} DNS Tunnel Monitor — {{ .Status }}
      {{ if eq .Status "firing" }}
      Обнаружены подозрительные DNS-события:
      {{ range .Alerts.Firing }}
      • {{ if .Labels.alertname }}{{ .Labels.alertname }}{{ else }}Alert{{ end }}
        {{ if .Labels.threat_type }}Тип: {{ .Labels.threat_type }}{{ end }}
        {{ if .Labels.client_pod }}Pod: {{ .Labels.client_pod }}{{ end }}
        {{ if .Labels.instance }}Instance: {{ .Labels.instance }}{{ end }}
        {{ if .ValueString }}Значение: {{ .ValueString }}{{ end }}
        {{ .StartsAt.Format "02.01.2006 15:04:05" }}
      {{ end }}
      {{ else }}
      Все алерты сняты (resolved).
      {{ range .Alerts.Resolved }}
      • {{ if .Labels.alertname }}{{ .Labels.alertname }}{{ else }}Alert{{ end }}{{ if .Labels.client_pod }} ({{ .Labels.client_pod }}){{ end }}
      {{ end }}
      {{ end }}
      —
      Grafana: {{ .ExternalURL }}
      {{ end }}

  # Короткий вариант для Telegram (укладывается в одно сообщение)
  - orgId: 1
    name: dns_telegram_short
    template: |
      {{ define "dns_telegram_short" }}
      {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} {{ .Status | toUpper }} — DNS Monitor
      {{ range .Alerts.Firing }}
      {{ if .Labels.alertname }}{{ .Labels.alertname }}{{ else }}Alert{{ end }} {{ if .Labels.threat_type }}({{ .Labels.threat_type }}){{ end }}{{ if .Labels.client_pod }} pod={{ .Labels.client_pod }}{{ end }}
      {{ end }}
      {{ .ExternalURL }}
      {{ end }}
