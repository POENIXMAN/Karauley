# Values для установки kube-prometheus-stack в k3s
# Использование: helm install prometheus prometheus-community/kube-prometheus-stack -f prometheus-k3s-values.yaml

# Отключаем проблемные webhooks для k3s
prometheusOperator:
  admissionWebhooks:
    enabled: false  # Отключаем webhooks, которые вызывают проблемы в k3s
    patch:
      enabled: false

# Альтернатива: если нужны webhooks, настройте их правильно
# prometheusOperator:
#   admissionWebhooks:
#     enabled: true
#     failurePolicy: Ignore  # Игнорировать ошибки вместо Fail
#     cert:
#       enabled: true

# Настройки Prometheus
prometheus:
  prometheusSpec:
    # Отключаем проверку webhook для ServiceMonitor
    serviceMonitorSelectorNilUsesHelmValues: false
    # Разрешаем все ServiceMonitor
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    
    # Ресурсы для Prometheus
    resources:
      requests:
        memory: 2Gi
        cpu: 1000m
      limits:
        memory: 4Gi
        cpu: 2000m
    
    # Хранилище (настройте под ваши нужды)
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

# Настройки Grafana
grafana:
  enabled: true
  adminPassword: admin  # Измените на более безопасный пароль
  
  # Ресурсы для Grafana
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  
  # Персистентное хранилище (опционально)
  persistence:
    enabled: false
    # enabled: true
    # size: 10Gi

# Alertmanager
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

# Node Exporter
nodeExporter:
  enabled: true

# Kube State Metrics
kubeStateMetrics:
  enabled: true

# Prometheus Operator
prometheusOperator:
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
    limits:
      memory: 400Mi
      cpu: 200m
