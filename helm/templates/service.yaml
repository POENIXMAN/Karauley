{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns-monitor.fullname" . }}
  namespace: {{ include "dns-monitor.namespace" . }}
  labels:
    {{- include "dns-monitor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.clusterIP "None" }}
  clusterIP: None
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: {{ .Values.service.name }}
      protocol: TCP
  selector:
    {{- include "dns-monitor.selectorLabels" . | nindent 4 }}
{{- end }}
