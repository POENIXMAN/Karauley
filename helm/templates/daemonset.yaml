apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "dns-monitor.fullname" . }}
  namespace: {{ include "dns-monitor.namespace" . }}
  labels:
    {{- include "dns-monitor.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "dns-monitor.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.daemonset.updateStrategy.type }}
    {{- if eq .Values.daemonset.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.daemonset.updateStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "dns-monitor.selectorLabels" . | nindent 8 }}
      {{- if .Values.prometheus.enabled }}
      annotations:
        prometheus.io/scrape: "{{ .Values.prometheus.scrape }}"
        prometheus.io/port: "{{ .Values.prometheus.port }}"
        prometheus.io/path: "{{ .Values.prometheus.path }}"
      {{- end }}
    spec:
      serviceAccountName: {{ include "dns-monitor.serviceAccountName" . }}
      
      # Для доступа к host network и процессам
      hostNetwork: {{ .Values.daemonset.hostNetwork }}
      hostPID: {{ .Values.daemonset.hostPID }}
      
      # DNS policy для hostNetwork
      dnsPolicy: {{ .Values.daemonset.dnsPolicy }}
      
      containers:
        - name: dns-monitor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          # eBPF требует privileged режим
          securityContext:
            {{- if .Values.daemonset.securityContext.privileged }}
            privileged: {{ .Values.daemonset.securityContext.privileged }}
            {{- else if .Values.daemonset.securityContext.capabilities }}
            capabilities:
              {{- toYaml .Values.daemonset.securityContext.capabilities | nindent 14 }}
            {{- end }}
          
          ports:
            - containerPort: {{ .Values.service.port }}
              name: {{ .Values.service.name }}
              protocol: TCP
          
          # Volume mounts для eBPF
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: config
              mountPath: /etc/dns-monitor
              readOnly: true
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: src
              mountPath: /usr/src
              readOnly: true
          
          # Environment variables
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_PROC
              value: "/host/proc"
            - name: METRICS_PORT
              value: "{{ .Values.service.port }}"
            {{- if .Values.daemonset.devmode }}
            - name: DEVMODE
              value: "1"
            {{- end }}
          
          # Resource limits
          resources:
            {{- toYaml .Values.daemonset.resources | nindent 12 }}
          
          # Probes
          {{- if .Values.daemonset.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.daemonset.livenessProbe | nindent 12 }}
          {{- end }}
          
          {{- if .Values.daemonset.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.daemonset.readinessProbe | nindent 12 }}
          {{- end }}
      
      # Volumes
      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: modules
          hostPath:
          path: /lib/modules
          type: Directory
        - name: src
          hostPath:
            path: /usr/src
            type: Directory
        - name: config
          configMap:
            name: {{ include "dns-monitor.fullname" . }}-config
      
      # Tolerations для запуска на всех нодах
      {{- if .Values.daemonset.tolerations }}
      tolerations:
        {{- toYaml .Values.daemonset.tolerations | nindent 8 }}
      {{- end }}
      
      # Node selector
      {{- if .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.daemonset.nodeSelector | nindent 8 }}
      {{- end }}
