{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dns-monitor.fullname" . }}
  namespace: {{ include "dns-monitor.namespace" . }}
  labels:
    {{- include "dns-monitor.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "dns-monitor.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "dns-monitor.namespace" . }}
  endpoints:
    - port: {{ .Values.service.name }}
      interval: {{ .Values.serviceMonitor.interval }}
      path: {{ .Values.prometheus.path }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
