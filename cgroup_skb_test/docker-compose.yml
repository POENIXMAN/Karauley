# Local run of DNS monitor (cgroup_skb). Requires host cgroup v2; Linux only.
# From repo root: docker compose -f cgroup_skb_test/docker-compose.yml up --build
services:
  dns-monitor:
    build:
      context: .
      dockerfile: cgroup_skb_test/Dockerfile
    image: dns-cgroup-monitor:latest
    privileged: true
    environment:
      CGROUP_PATH: /host-cgroup
    volumes:
      - /sys/fs/cgroup:/host-cgroup
      - /sys:/sys:ro
      - /lib/modules:/lib/modules:ro
    restart: "no"
