# Minimal CGROUP_SKB test: run in cluster, attach to host cgroup, print DNS payload.
# Build: from repo root: docker build -f cgroup_skb_test/Dockerfile -t cgroup-skb-test:latest .
# Apply: kubectl apply -f cgroup_skb_test/k8s/deployment.yaml
# Logs:  kubectl logs -f deployment/cgroup-skb-test -n default
# In another pod/terminal generate DNS: nslookup google.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgroup-skb-test
  namespace: default
  labels:
    app: cgroup-skb-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cgroup-skb-test
  template:
    metadata:
      labels:
        app: cgroup-skb-test
    spec:
      nodeName: k8s-master
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        # Use versioned tag (like helm's localhost/ebpfmodule:v1.4) so K3s doesn't resolve to docker.io/library/... for :latest
        - name: test
          image: localhost/cgroup-skb-test:v1
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: CGROUP_PATH
              value: "/host-cgroup"
          volumeMounts:
            - name: host-cgroup
              mountPath: /host-cgroup
              readOnly: false
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: src
              mountPath: /usr/src
              readOnly: true
      volumes:
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: src
          hostPath:
            path: /usr/src
            type: Directory
---
