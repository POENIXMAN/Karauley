# DaemonSet: DNS monitor (cgroup_skb) on every node. Cluster-agnostic, identifies pod by cgroup_id.
# Mounts: host cgroup, /sys, /lib/modules, /usr/src (kernel headers — чтобы один образ собирал BPF под ядро каждой ноды).
# Build from repo root: docker build -f cgroup_skb_test/Dockerfile -t dns-cgroup-monitor:v1 .
# Apply: kubectl apply -f cgroup_skb_test/k8s/daemonset.yaml
# Logs:  kubectl logs -f -l app=dns-cgroup-monitor -n default --all-containers=true
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dns-cgroup-monitor
  namespace: default
  labels:
    app: dns-cgroup-monitor
spec:
  selector:
    matchLabels:
      app: dns-cgroup-monitor
  template:
    metadata:
      labels:
        app: dns-cgroup-monitor
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: monitor
          image: dns-cgroup-monitor:v1
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: CGROUP_PATH
              value: "/host-cgroup"
          volumeMounts:
            - name: host-cgroup
              mountPath: /host-cgroup
              readOnly: false
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: usr-src
              mountPath: /usr/src
              readOnly: true
      volumes:
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: usr-src
          hostPath:
            path: /usr/src
            type: Directory
